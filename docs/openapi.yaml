openapi: 3.1.0
info:
  title: Autonomous Commerce API
  version: 1.8.0
servers:
  - url: /
paths:
  /health:
    get:
      summary: Service health
      responses:
        "200": {description: OK}
  /ready:
    get:
      summary: Dependency readiness
      responses:
        "200": {description: Ready}
        "503": {description: Not ready}
  /api/products:
    get:
      summary: List published products
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        "200": {description: Product list}
  /api/products/{id}:
    get:
      summary: Get published product and server-side price
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Product}
        "404": {description: Not found}
  /api/quote:
    post:
      summary: Generate a server-side quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cart"
      responses:
        "200": {description: Quote}
        "400": {description: Invalid request}
  /api/orders:
    post:
      summary: Create an order and reserve inventory
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201": {description: Order created}
        "400": {description: Invalid request}
        "500": {description: Inventory or persistence error}
  /api/orders/{id}/pay:
    post:
      summary: Create payment checkout for an order
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16}}
      responses:
        "201": {description: Payment checkout}
        "503": {description: Payment provider not configured}
  /api/orders/{id}:
    get:
      summary: Get public order tracking state
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Order tracking}
        "404": {description: Not found}
components:
  schemas:
    Cart:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: {type: string, format: uuid}
              quantity: {type: integer, minimum: 1, maximum: 99}
    CreateOrder:
      allOf:
        - $ref: "#/components/schemas/Cart"
        - type: object
          required: [email, country]
          properties:
            email: {type: string, format: email}
            country: {type: string, minLength: 2, maxLength: 2}
            shippingAddress: {type: object}
